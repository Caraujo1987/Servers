<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Visor de realidad aumentada del modelo de servidores">
    <title>Servers en AR</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <model-viewer
      id="ar-viewer"
      src="./SERVERS.glb?v=20260830-equal-panels-poster"
      ios-src="./SERVERS.usdz?v=20260830-equal-panels-poster"
      alt="Modelo 3D de servidores"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-placement="floor"
      ar-scale="auto"
      xr-environment
      camera-controls
      camera-orbit="0deg 75deg 145%"
      touch-action="pan-y"
      tone-mapping="neutral"
      poster="./poster-current.png?v=20260830-equal-panels"
      shadow-intensity="1">
      <div class="placement-switch" slot="top" aria-label="Plano de realidad aumentada">
        <button class="placement-option active" type="button" data-placement="floor" aria-pressed="true">Piso</button>
        <button class="placement-option" type="button" data-placement="wall" aria-pressed="false">Pared</button>
      </div>
      <div class="progress-bar hide" slot="progress-bar">
        <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button" type="button">Ver en mi espacio</button>
      <div id="ar-prompt">
        <img src="./ar_hand_prompt.png" alt="Mueve el telefono para ubicar el modelo">
      </div>
      <div id="ar-tools">
        <span id="tracking-status">Mueve el telefono para reconocer el plano</span>
        <button id="capture-button" type="button">Foto</button>
      </div>
    </model-viewer>
    <div class="brand-logo" aria-label="ServiceLab AI">
      <img src="./Logo.jpeg" alt="ServiceLab AI">
    </div>
    <script src="./script.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  </body>
</html>
